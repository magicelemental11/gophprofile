x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: gophprofile:latest
  restart: unless-stopped
  environment:
    DATABASE_DSN: postgres://${POSTGRES_USER:-gopher}:${POSTGRES_PASSWORD:-gopher}@postgres:5432/${POSTGRES_DB:-gophprofile}?sslmode=disable
    AMQP_URL: amqp://${RABBITMQ_USER:-gopher}:${RABBITMQ_PASSWORD:-gopher}@rabbitmq:5672/
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gopher}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gopher-secret}
    S3_BUCKET: ${S3_BUCKET:-avatars}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
    UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-10}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  server:
    <<: *app
    command: ["/app/server"]
    ports:
      - "8080:8080"

  worker:
    <<: *app
    command: ["/app/worker"]
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gophprofile}
      POSTGRES_USER: ${POSTGRES_USER:-gopher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gopher}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gopher}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gopher}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gopher}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gopher-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
