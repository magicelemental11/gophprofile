route:
  receiver: warning
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: warning
    webhook_configs:
      - url: http://alert-receiver:8080/alertmanager/warning
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: http://alert-receiver:8080/alertmanager/critical
        send_resolved: true
