apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: OpenSearch
    uid: opensearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    jsonData:
      database: gophprofile-logs-*
      flavor: opensearch
      version: 2.19.6
      timeField: "@timestamp"
      logMessageField: msg
      logLevelField: level
      dataLinks:
        - field: trace_id
          url: http://localhost:16686/trace/$${__value.raw}
